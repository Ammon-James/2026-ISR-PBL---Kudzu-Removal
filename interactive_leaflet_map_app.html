<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geo Explorer - Interactive Map</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Fix Leaflet map z-index issues with custom overlays */
    .leaflet-pane { z-index: 10 !important; }
    .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
    /* Custom scrollbar for sidebar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-80 md:w-96 bg-slate-900/95 backdrop-blur-md border-r border-slate-800 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0 md:static">
    
    <!-- Sidebar Header -->
    <div class="p-5 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-map-location-dot text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white leading-tight">Geo Explorer</h1>
          <p class="text-xs text-slate-400">Interactive Spatial Notes</p>
        </div>
      </div>
      <button id="close-sidebar-btn" class="md:hidden text-slate-400 hover:text-white p-2">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>

    <!-- Toolbar Controls -->
    <div class="p-4 border-b border-slate-800 space-y-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" placeholder="Search markers..." class="w-full bg-slate-800 text-sm text-slate-200 pl-9 pr-4 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button id="locate-btn" class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2 px-3 rounded-lg transition shadow-md shadow-indigo-600/20">
          <i class="fa-solid fa-crosshairs"></i> Locate Me
        </button>
        <button id="theme-toggle-btn" class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium py-2 px-3 rounded-lg border border-slate-700 transition">
          <i class="fa-solid fa-moon"></i> <span id="theme-btn-text">Dark Mode</span>
        </button>
      </div>
    </div>

    <!-- Marker List -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3">
      <div class="flex items-center justify-between text-xs text-slate-400 px-1">
        <span>SAVED LOCATIONS (<span id="marker-count">0</span>)</span>
        <button id="clear-all-btn" class="text-rose-400 hover:text-rose-300 hover:underline">Clear All</button>
      </div>

      <div id="marker-list" class="space-y-2">
        <!-- Marker items will be injected here dynamically -->
      </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="p-4 border-t border-slate-800 text-xs text-slate-500 flex justify-between items-center bg-slate-950/50">
      <span>Powered by Leaflet & OpenStreetMap</span>
      <button id="export-btn" class="hover:text-slate-300 transition" title="Export GeoJSON">
        <i class="fa-solid fa-file-export text-sm"></i>
      </button>
    </div>
  </aside>

  <!-- Map Container -->
  <main class="flex-1 relative h-full w-full">
    <!-- Mobile Header Bar -->
    <div class="absolute top-4 left-4 right-4 z-20 flex justify-between items-center pointer-events-none md:hidden">
      <button id="open-sidebar-btn" class="pointer-events-auto bg-slate-900/90 text-white p-3 rounded-xl shadow-lg border border-slate-800 hover:bg-slate-800 transition">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
      <div class="pointer-events-auto bg-slate-900/90 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-800 text-xs font-semibold text-slate-300 shadow-lg">
        Tap map to add marker
      </div>
    </div>

    <!-- Map Canvas -->
    <div id="map" class="h-full w-full bg-slate-950"></div>

    <!-- Custom Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-800 text-white px-4 py-3 rounded-xl border border-slate-700 shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3">
      <i id="toast-icon" class="fa-solid fa-circle-info text-indigo-400"></i>
      <span id="toast-message" class="text-sm font-medium">Notification message</span>
    </div>
  </main>

  <!-- Add Marker Modal -->
  <div id="marker-modal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4 transform transition-all scale-95 opacity-0" id="modal-card">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-indigo-500"></i> Add New Marker
        </h3>
        <button id="modal-close-btn" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="marker-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Title</label>
          <input type="text" id="marker-title" required placeholder="e.g. Favorite Coffee Shop" class="w-full bg-slate-800 text-sm text-slate-100 px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Category</label>
          <select id="marker-category" class="w-full bg-slate-800 text-sm text-slate-100 px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500">
            <option value="favorite">⭐ Favorite</option>
            <option value="food">🍕 Food & Drink</option>
            <option value="sight">📸 Sightseeing</option>
            <option value="note">📝 Personal Note</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Notes / Description</label>
          <textarea id="marker-notes" rows="3" placeholder="Add details or memories about this location..." class="w-full bg-slate-800 text-sm text-slate-100 px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>

        <div class="text-xs text-slate-500 font-mono">
          Coordinates: <span id="modal-coords">0.0000, 0.0000</span>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="modal-cancel-btn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition shadow-md shadow-indigo-600/20">Save Marker</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    let map, activeTileLayer;
    let markersList = [];
    let leafletMarkers = {};
    let pendingLatLng = null;
    let currentTheme = 'dark';

    // Map Tile Configs
    const tiles = {
      light: {
        url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
      },
      dark: {
        url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
      }
    };

    // Category Color & Icon map
    const categoryConfig = {
      favorite: { color: '#f59e0b', icon: 'fa-star', label: 'Favorite' },
      food: { color: '#ef4444', icon: 'fa-utensils', label: 'Food & Drink' },
      sight: { color: '#3b82f6', icon: 'fa-camera', label: 'Sightseeing' },
      note: { color: '#10b981', icon: 'fa-sticky-note', label: 'Note' }
    };

    window.onload = function() {
      // Initialize map (default view: London, or user's last saved location)
      map = L.map('map', {
        zoomControl: false
      }).setView([51.505, -0.09], 13);

      // Custom Zoom Control Position
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Set initial Tile Layer
      setTileLayer(currentTheme);

      // Load saved markers from localStorage
      loadStoredMarkers();

      // Setup Event Listeners
      initEventListeners();
    };

    function setTileLayer(theme) {
      if (activeTileLayer) {
        map.removeLayer(activeTileLayer);
      }
      activeTileLayer = L.tileLayer(tiles[theme].url, {
        maxZoom: 19,
        attribution: tiles[theme].attribution
      }).addTo(map);
    }

    function initEventListeners() {
      // Map Click -> Open Modal
      map.on('click', function(e) {
        pendingLatLng = e.latlng;
        openModal(e.latlng);
      });

      // Form Submit
      document.getElementById('marker-form').addEventListener('submit', handleFormSubmit);

      // Sidebar Toggle Controls
      document.getElementById('open-sidebar-btn').addEventListener('click', toggleSidebar);
      document.getElementById('close-sidebar-btn').addEventListener('click', toggleSidebar);

      // Modal Controls
      document.getElementById('modal-close-btn').addEventListener('click', closeModal);
      document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);

      // Locate Me Button
      document.getElementById('locate-btn').addEventListener('click', handleLocateUser);

      // Theme Toggle Button
      document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

      // Search input filter
      document.getElementById('search-input').addEventListener('input', function(e) {
        renderSidebarList(e.target.value.toLowerCase());
      });

      // Clear All Markers
      document.getElementById('clear-all-btn').addEventListener('click', clearAllMarkers);

      // Export GeoJSON
      document.getElementById('export-btn').addEventListener('click', exportGeoJSON);
    }

    function openModal(latlng) {
      document.getElementById('modal-coords').innerText = `${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`;
      document.getElementById('marker-title').value = '';
      document.getElementById('marker-notes').value = '';
      
      const modal = document.getElementById('marker-modal');
      const card = document.getElementById('modal-card');
      modal.classList.remove('hidden');
      setTimeout(() => {
        card.classList.remove('scale-95', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('marker-modal');
      const card = document.getElementById('modal-card');
      card.classList.remove('scale-100', 'opacity-100');
      card.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      if (!pendingLatLng) return;

      const title = document.getElementById('marker-title').value.trim();
      const category = document.getElementById('marker-category').value;
      const notes = document.getElementById('marker-notes').value.trim();

      const newMarkerData = {
        id: Date.now().toString(),
        title: title,
        category: category,
        notes: notes,
        lat: pendingLatLng.lat,
        lng: pendingLatLng.lng,
        timestamp: new Date().toLocaleDateString()
      };

      markersList.push(newMarkerData);
      saveMarkersToStorage();
      addMarkerToMap(newMarkerData);
      renderSidebarList();
      closeModal();

      showToast(`Added "${title}"`, 'fa-circle-check', 'indigo');
    }

    function addMarkerToMap(data) {
      const config = categoryConfig[data.category] || categoryConfig.note;

      // Custom Leaflet Marker Icon using FontAwesome
      const customIcon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div style="background-color: ${config.color};" class="w-8 h-8 rounded-full flex items-center justify-center text-white border-2 border-white shadow-lg transform -translate-x-1/2 -translate-y-1/2 hover:scale-110 transition">
                 <i class="fa-solid ${config.icon} text-xs"></i>
               </div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      const leafletMarker = L.marker([data.lat, data.lng], { icon: customIcon }).addTo(map);

      // Popup Content
      const popupHtml = `
        <div class="p-1 max-w-xs font-sans text-slate-800">
          <div class="flex items-center gap-2 mb-1">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${config.color}"></span>
            <strong class="text-sm font-bold text-slate-900">${escapeHtml(data.title)}</strong>
          </div>
          ${data.notes ? `<p class="text-xs text-slate-600 mb-2">${escapeHtml(data.notes)}</p>` : ''}
          <div class="text-[10px] text-slate-400 border-t border-slate-100 pt-1 flex justify-between">
            <span>${data.timestamp}</span>
            <span>${data.lat.toFixed(3)}, ${data.lng.toFixed(3)}</span>
          </div>
        </div>
      `;

      leafletMarker.bindPopup(popupHtml);
      leafletMarkers[data.id] = leafletMarker;
    }

    function renderSidebarList(filterTerm = '') {
      const container = document.getElementById('marker-list');
      document.getElementById('marker-count').innerText = markersList.length;

      const filtered = markersList.filter(item => 
        item.title.toLowerCase().includes(filterTerm) || 
        item.notes.toLowerCase().includes(filterTerm)
      );

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-500 text-xs">
            <i class="fa-solid fa-map-pin text-2xl mb-2 text-slate-600 block"></i>
            ${filterTerm ? 'No matching locations found.' : 'No locations saved yet.<br>Click anywhere on the map to add one!'}
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const config = categoryConfig[item.category] || categoryConfig.note;
        return `
          <div class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-xl p-3 transition cursor-pointer group flex justify-between items-start" onclick="flyToMarker('${item.id}')">
            <div class="space-y-1 pr-2">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full" style="background-color: ${config.color}"></span>
                <h4 class="font-semibold text-sm text-slate-200 group-hover:text-indigo-400 transition">${escapeHtml(item.title)}</h4>
              </div>
              ${item.notes ? `<p class="text-xs text-slate-400 line-clamp-2">${escapeHtml(item.notes)}</p>` : ''}
            </div>
            <button onclick="event.stopPropagation(); deleteMarker('${item.id}')" class="text-slate-500 hover:text-rose-400 p-1 transition opacity-60 group-hover:opacity-100" title="Delete">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;
      }).join('');
    }

    function flyToMarker(id) {
      const data = markersList.find(m => m.id === id);
      if (data && leafletMarkers[id]) {
        map.flyTo([data.lat, data.lng], 16, { duration: 1.2 });
        leafletMarkers[id].openPopup();

        // Close sidebar on mobile
        if (window.innerWidth < 768) {
          document.getElementById('sidebar').classList.add('-translate-x-full');
        }
      }
    }

    function deleteMarker(id) {
      if (leafletMarkers[id]) {
        map.removeLayer(leafletMarkers[id]);
        delete leafletMarkers[id];
      }
      markersList = markersList.filter(m => m.id !== id);
      saveMarkersToStorage();
      renderSidebarList();
      showToast('Marker removed', 'fa-trash-can', 'rose');
    }

    function clearAllMarkers() {
      if (markersList.length === 0) return;
      
      // Remove all leaflet markers
      Object.keys(leafletMarkers).forEach(id => map.removeLayer(leafletMarkers[id]));
      leafletMarkers = {};
      markersList = [];
      saveMarkersToStorage();
      renderSidebarList();
      showToast('All markers cleared', 'fa-circle-check', 'amber');
    }

    function handleLocateUser() {
      if (!navigator.geolocation) {
        showToast('Geolocation is not supported by your browser', 'fa-triangle-exclamation', 'amber');
        return;
      }

      showToast('Locating position...', 'fa-location-arrow', 'indigo');

      navigator.geolocation.getCurrentPosition(
        position => {
          const { latitude, longitude } = position.coords;
          map.flyTo([latitude, longitude], 15);
          
          // Temporary blue pulse marker for user position
          L.circleMarker([latitude, longitude], {
            radius: 8,
            fillColor: '#3b82f6',
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("You are here").openPopup();

          showToast('Located successfully!', 'fa-location-dot', 'emerald');
        },
        error => {
          showToast('Unable to retrieve your location', 'fa-circle-xmark', 'rose');
        }
      );
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTileLayer(currentTheme);
      
      const btnText = document.getElementById('theme-btn-text');
      const btnIcon = document.querySelector('#theme-toggle-btn i');
      
      if (currentTheme === 'light') {
        btnText.innerText = 'Light Mode';
        btnIcon.className = 'fa-solid fa-sun text-amber-400';
      } else {
        btnText.innerText = 'Dark Mode';
        btnIcon.className = 'fa-solid fa-moon';
      }
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('-translate-x-full');
    }

    function saveMarkersToStorage() {
      localStorage.setItem('geo_explorer_markers', JSON.stringify(markersList));
    }

    function loadStoredMarkers() {
      const stored = localStorage.getItem('geo_explorer_markers');
      if (stored) {
        try {
          markersList = JSON.parse(stored);
          markersList.forEach(m => addMarkerToMap(m));
        } catch (e) {
          markersList = [];
        }
      }
      renderSidebarList();
    }

    function exportGeoJSON() {
      if (markersList.length === 0) {
        showToast('No markers to export', 'fa-info-circle', 'amber');
        return;
      }

      const geojson = {
        type: "FeatureCollection",
        features: markersList.map(m => ({
          type: "Feature",
          geometry: { type: "Point", coordinates: [m.lng, m.lat] },
          properties: { title: m.title, category: m.category, notes: m.notes, timestamp: m.timestamp }
        }))
      };

      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `geo-explorer-markers.geojson`;
      a.click();
      URL.revokeObjectURL(url);

      showToast('Exported GeoJSON file', 'fa-file-arrow-down', 'emerald');
    }

    function showToast(msg, icon = 'fa-circle-info', color = 'indigo') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.innerText = msg;
      toastIcon.className = `fa-solid ${icon} text-${color}-400`;

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function escapeHtml(str) {
      return str ? str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]) : '';
    }
  </script>
</body>
</html>
