<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kudzu & Grazing Interactive Registry</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & Geoman Polygon Drawing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <!-- FontAwesome & Inter Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; z-index: 1; }
        .leaflet-popup-content-wrapper { padding: 0; border-radius: 12px; overflow: hidden; }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-800 flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white z-20 px-4 py-3 border-b border-slate-800 flex items-center justify-between shadow-md shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                <i class="fa-solid fa-leaf text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base md:text-lg leading-tight text-white">Kudzu Grazing Registry</h1>
                <p class="text-xs text-slate-400">Realtime Collaborative Map</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <div id="userInfo" class="hidden text-xs text-slate-300 mr-2 sm:block"></div>
            <button id="authBtn" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg transition-colors">
                Sign In
            </button>
        </div>
    </header>

    <main class="relative flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-80 md:w-96 h-full bg-slate-900 border-r border-slate-800 flex flex-col z-10">
            <div class="p-4 border-b border-slate-800 space-y-3">
                <div class="text-xs text-slate-400 bg-slate-800 p-2.5 rounded-lg border border-slate-700">
                    <i class="fa-solid fa-draw-polygon text-emerald-400 mr-1"></i>
                    Use the toolbar on the left of the map to draw Kudzu area polygons or place single pins.
                </div>
            </div>

            <!-- List of Saved Entries -->
            <div class="flex-1 overflow-y-auto p-4 space-y-2.5" id="entriesList">
                <p class="text-xs text-slate-500 text-center py-4">Loading map data...</p>
            </div>
        </aside>

        <!-- Map Screen -->
        <div class="flex-1 relative h-full">
            <div id="map"></div>
        </div>
    </main>

    <!-- Authentication Modal -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-[2000] hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-slate-200 relative">
            <button id="closeAuthModal" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="font-bold text-lg text-white mb-1" id="authModalTitle">Account Login</h3>
            <p class="text-xs text-slate-400 mb-4">Sign in to report kudzu sites or offer livestock services</p>

            <form id="authForm" class="space-y-3">
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Email</label>
                    <input type="email" id="authEmail" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Password</label>
                    <input type="password" id="authPassword" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div id="roleSelectContainer" class="hidden">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Role</label>
                    <select id="authRole" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                        <option value="landowner">Landowner (Reporting Kudzu)</option>
                        <option value="livestock_owner">Livestock Owner (Providing Animals)</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-semibold transition-colors mt-2" id="authSubmitBtn">
                    Sign In
                </button>
            </form>

            <div class="mt-4 text-center">
                <button id="toggleAuthMode" class="text-xs text-emerald-400 hover:underline">Need an account? Sign Up</button>
            </div>
        </div>
    </div>

    <!-- Entry Details Modal -->
    <div id="detailsModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-[2000] hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 text-slate-200">
            <h3 class="font-bold text-lg text-white mb-2">Save Location Details</h3>
            <form id="detailsForm" class="space-y-3">
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Title *</label>
                    <input type="text" id="entryTitle" required placeholder="e.g. 2-Acre Kudzu Patch or Goat Herd Team" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Category</label>
                    <select id="entryType" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                        <option value="kudzu">Kudzu Infestation</option>
                        <option value="livestock">Livestock Provider</option>
                        <option value="cleared">Cleared Site</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Description / Contact Notes</label>
                    <textarea id="entryDesc" rows="3" placeholder="Provide details (acres, terrain type, herd size, contact info)..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" id="cancelSaveBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Discard</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold">Save Entry</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script>
        // REPLACE WITH YOUR SUPABASE CREDENTIALS
        const SUPABASE_URL = 'https://ymoawcorkmtnwcmolrue.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_6VKjR5xPYPRqSCIOJy683A_pmYwWiph';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let map, currentUser = null, activeDrawnLayer = null;
        let isSignUp = false;

        function initMap() {
            map = L.map('map').setView([33.7490, -84.3880], 11);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // Configure Geoman Drawing Toolbar
            map.pm.addControls({
                position: 'topleft',
                drawMarker: true,
                drawPolygon: true,
                drawPolyline: false,
                drawCircle: false,
                drawCircleMarker: false,
                drawRectangle: true,
                editMode: false,
                dragMode: false,
                cutPolygon: false,
                removalMode: false
            });

            // Handle shape drawing
            map.on('pm:create', (e) => {
                if (!currentUser) {
                    alert('Please log in to save entries to the shared map.');
                    map.removeLayer(e.layer);
                    openAuthModal();
                    return;
                }
                activeDrawnLayer = e.layer;
                document.getElementById('detailsModal').classList.remove('hidden');
            });

            checkUser();
            fetchEntries();
        }

        // Check authentication state
        async function checkUser() {
            const { data: { session } } = await db.auth.getSession();
            updateAuthUI(session ? session.user : null);

            db.auth.onAuthStateChange((_event, session) => {
                updateAuthUI(session ? session.user : null);
            });
        }

        function updateAuthUI(user) {
            currentUser = user;
            const authBtn = document.getElementById('authBtn');
            const userInfo = document.getElementById('userInfo');

            if (user) {
                userInfo.textContent = user.email;
                userInfo.classList.remove('hidden');
                authBtn.textContent = 'Log Out';
                authBtn.onclick = () => db.auth.signOut();
            } else {
                userInfo.classList.add('hidden');
                authBtn.textContent = 'Sign In';
                authBtn.onclick = openAuthModal;
            }
        }

        function openAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
        }

        document.getElementById('closeAuthModal').onclick = () => {
            document.getElementById('authModal').classList.add('hidden');
        };

        document.getElementById('toggleAuthMode').onclick = () => {
            isSignUp = !isSignUp;
            document.getElementById('authModalTitle').textContent = isSignUp ? 'Create Account' : 'Account Login';
            document.getElementById('authSubmitBtn').textContent = isSignUp ? 'Sign Up' : 'Sign In';
            document.getElementById('roleSelectContainer').classList.toggle('hidden', !isSignUp);
            document.getElementById('toggleAuthMode').textContent = isSignUp ? 'Existing user? Sign In' : 'Need an account? Sign Up';
        };

        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            if (isSignUp) {
                const role = document.getElementById('authRole').value;
                const { data, error } = await db.auth.signUp({ email, password });
                if (error) return alert(error.message);
                if (data.user) {
                    await db.from('profiles').insert([{ id: data.user.id, email, role }]);
                    alert('Account created successfully!');
                }
            } else {
                const { error } = await db.auth.signInWithPassword({ email, password });
                if (error) return alert(error.message);
            }
            document.getElementById('authModal').classList.add('hidden');
        };

        // Fetch entries from Supabase
        async function fetchEntries() {
            const { data, error } = await db.from('map_entries').select('*');
            if (error) return console.error('Error fetching entries:', error);

            const listContainer = document.getElementById('entriesList');
            listContainer.innerHTML = '';

            data.forEach(entry => {
                const color = entry.type === 'kudzu' ? '#f59e0b' : entry.type === 'livestock' ? '#10b981' : '#3b82f6';

                const geoJsonLayer = L.geoJSON(entry.geometry, {
                    style: () => ({ color: color, weight: 3, fillOpacity: 0.4 }),
                    pointToLayer: (feature, latlng) => L.circleMarker(latlng, { radius: 8, fillColor: color, color: '#ffffff', weight: 2, fillOpacity: 0.9 })
                }).addTo(map);

                geoJsonLayer.bindPopup(`
                    <div class="p-3 bg-slate-900 text-white rounded-lg">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">${entry.type}</span>
                        <h4 class="font-bold text-sm text-white">${escapeHtml(entry.title)}</h4>
                        <p class="text-xs text-slate-300 mt-1">${escapeHtml(entry.description || '')}</p>
                    </div>
                `);

                const card = document.createElement('div');
                card.className = "bg-slate-800 p-3 rounded-xl border border-slate-700/60 cursor-pointer hover:border-emerald-500 transition-colors";
                card.innerHTML = `
                    <h4 class="font-semibold text-sm text-slate-100">${escapeHtml(entry.title)}</h4>
                    <span class="text-[10px] font-medium text-emerald-400 uppercase tracking-wider">${entry.type}</span>
                    ${entry.description ? `<p class="text-xs text-slate-400 mt-1 line-clamp-2">${escapeHtml(entry.description)}</p>` : ''}
                `;
                card.onclick = () => {
                    map.fitBounds(geoJsonLayer.getBounds(), { maxZoom: 15 });
                    geoJsonLayer.openPopup();
                };
                listContainer.appendChild(card);
            });
        }

        // Save entry form submit
        document.getElementById('detailsForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!activeDrawnLayer || !currentUser) return;

            const title = document.getElementById('entryTitle').value.trim();
            const type = document.getElementById('entryType').value;
            const description = document.getElementById('entryDesc').value.trim();
            const geometry = activeDrawnLayer.toGeoJSON().geometry;

            const { error } = await db.from('map_entries').insert([{
                user_id: currentUser.id,
                title,
                type,
                description,
                geometry
            }]);

            if (error) {
                alert('Save failed: ' + error.message);
            } else {
                map.removeLayer(activeDrawnLayer);
                fetchEntries();
                document.getElementById('detailsModal').classList.add('hidden');
                document.getElementById('detailsForm').reset();
            }
        };

        document.getElementById('cancelSaveBtn').onclick = () => {
            if (activeDrawnLayer) map.removeLayer(activeDrawnLayer);
            document.getElementById('detailsModal').classList.add('hidden');
            document.getElementById('detailsForm').reset();
        };

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
        }

        window.onload = initMap;
    </script>
</body>
</html>
